name: Relato de bug
description: Relate um problema da integração.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Antes de abrir, procure o mesmo problema nas [issues existentes](https://github.com/roquerodrigo/ha-metro-sp/issues?q=is%3Aissue).
        Relate um problema por issue.
  - type: input
    id: version
    attributes:
      label: Versão da integração
      description: Como aparece no HACS.
      placeholder: 1.2.3
    validations:
      required: true
  - type: textarea
    id: system-health
    attributes:
      label: Informações do sistema
      description: >-
        Vá em Configurações → Sistema → Reparos → ⋮ → Informações do sistema, selecione Copiar e cole aqui.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: O que você esperava que acontecesse e o que aconteceu no lugar.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs de depuração
      description: >-
        Na página da integração, selecione ⋮ → Habilitar log de depuração, reproduza o problema,
        depois selecione ⋮ → Desabilitar log de depuração e cole o trecho relevante do log baixado.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnósticos
      description: Na página do dispositivo ou da integração, selecione ⋮ → Fazer download dos diagnósticos e arraste o arquivo para cá.
