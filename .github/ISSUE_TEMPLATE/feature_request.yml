name: Pedido de funcionalidade
description: Sugira uma nova funcionalidade ou uma melhoria.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Antes de abrir, procure a mesma ideia nas [issues existentes](https://github.com/roquerodrigo/ha-metro-sp/issues?q=is%3Aissue).
        Sugira uma funcionalidade por issue.
  - type: textarea
    id: problem
    attributes:
      label: Problema ou caso de uso
      description: O que você quer fazer e o que atrapalha hoje.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Como você gostaria que funcionasse.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Outras soluções ou contornos que você já tentou.
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Capturas de tela, modelo do aparelho, links ou qualquer outra coisa que ajude.
